<!DOCTYPE html>
<html>

<head>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100%;
            font-family: Arial;
            color: #EEEEEE;
        }

        body {
            background-color: #222222;
            flex: 1;
            flex-direction: column;
        }

        .header {
            padding: 15px;
            background-color: rgb(43, 73, 91);
            font-size: 25px;
            display: flex;
            align-items: center;
        }

        .body {
            flex: 1;
            display: flex;
            flex-direction: row;
            position: relative;
        }

        .menu {
            width: 250px;
            background-color: rgb(36, 65, 81);
            display: flex;
            flex-direction: column;
        }

        .menu .list {
            padding: 0;
            margin: 0;
        }

        .menu .list li {
            list-style-type: none;
        }

        .menu .list li a {
            display: inline-block;
            text-decoration: none;
            width: 100%;
            height: 100%;
            padding: 15px;
            font-size: 1.2em;
            color: #EEEEEE;
            box-sizing: border-box;
            transition: padding-left 0.25s;
        }

        .menu .list li a:hover,
        .menu .list li a.selected {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .menu .list li a.selected {
            padding-left: 30px;
        }

        .menu .list-container {
            display: flex;
            position: relative;
            flex: 1;
        }

        .menu .list-container .list {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            overflow: auto
        }

        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
<script defer src="index.js"></script><meta charset="utf-8"></meta></head>

<body>
    <div class="header">
        <img
            src="logo.svg"
            style="margin-right:15px"
        />
        jpx - a javascript image processing toolkit
    </div>
    <div class="body">
        <div class="menu">
            <h2 style="padding-left:15px">Filters</h2>
            <div class="list-container">
                <ul class="list">
                </ul>
            </div>
        </div>
        <div
            id="content"
            class="content"
        >
            <img
                src="./Lenna.png"
                style="margin-right:15px"
            />
        </div>
    </div>
</body>

</html>
